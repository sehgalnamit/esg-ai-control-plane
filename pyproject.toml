[project]
name = "esg-ai-control-plane"
version = "0.1.0"
description = "A runnable demonstration that ESG reporting is an engineering discipline: lineage, FinOps/GreenOps telemetry, and AI governance solved inside the systems that run the business."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["deployment"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
